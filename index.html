<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo Dulce</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins', sans-serif;
}

body{
  background:#fff7f5;
}

/* NAVBAR */
header{
  background:#ff7a7a;
  padding:20px;
  text-align:center;
  color:white;
  font-size:24px;
  font-weight:bold;
}

/* HERO */
.hero{
  text-align:center;
  padding:40px;
}

.hero h1{
  font-size:40px;
}

.hero p{
  opacity:0.7;
}

/* BOTONES FILTRO */
.filtros{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:20px;
}

.filtros button{
  padding:10px 20px;
  border:none;
  background:#ffd1d1;
  cursor:pointer;
  border-radius:20px;
}

.filtros button:hover{
  background:#ffaaaa;
}

/* CARDS */
.container{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
  padding:20px;
}

.card{
  width:250px;
  background:white;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-10px);
}

.card img{
  width:100%;
  height:160px;
  object-fit:cover;
}

.card-content{
  padding:15px;
}

.card h3{
  margin-bottom:10px;
}

.precio{
  font-weight:bold;
  color:#ff7a7a;
}

.btn{
  margin-top:10px;
  padding:10px;
  width:100%;
  border:none;
  background:#25D366;
  color:white;
  cursor:pointer;
  border-radius:10px;
}

.btn:hover{
  background:#1ebe5d;
}
</style>
</head>

<body>

<header>
🍰 Dulce Tentación
</header>

<section class="hero">
<h1>Catálogo de Postres</h1>
<p>Elegí tu favorito y pedí por WhatsApp</p>
</section>

<div class="filtros">
<button onclick="filtrar('todos')">Todos</button>
<button onclick="filtrar('torta')">Tortas</button>
<button onclick="filtrar('galleta')">Galletas</button>
</div>

<section class="container" id="catalogo">

<div class="card torta">
<img src="https://source.unsplash.com/300x200/?cake">
<div class="card-content">
<h3>Torta Chocolate</h3>
<p class="precio">$8500</p>
<button class="btn" onclick="comprar('Torta Chocolate')">Pedir</button>
</div>
</div>

<div class="card galleta">
<img src="https://source.unsplash.com/300x200/?cookies">
<div class="card-content">
<h3>Cookies</h3>
<p class="precio">$3500</p>
<button class="btn" onclick="comprar('Cookies')">Pedir</button>
</div>
</div>

<div class="card torta">
<img src="https://source.unsplash.com/300x200/?strawberry-cake">
<div class="card-content">
<h3>Torta Frutilla</h3>
<p class="precio">$9000</p>
<button class="btn" onclick="comprar('Torta Frutilla')">Pedir</button>
</div>
</div>

</section>

<script>
function comprar(producto){
  let numero = "5491123456789"; // CAMBIÁ ESTE NÚMERO
  let mensaje = "Hola, quiero pedir: " + producto;
  let url = "https://wa.me/" + numero + "?text=" + encodeURIComponent(mensaje);
  window.open(url, "_blank");
}

function filtrar(categoria){
  let cards = document.querySelectorAll(".card");

  cards.forEach(card=>{
    if(categoria === "todos"){
      card.style.display = "block";
    } else {
      if(card.classList.contains(categoria)){
        card.style.display = "block";
      } else {
        card.style.display = "none";
      }
    }
  });
}
</script>

</body>
</html>
