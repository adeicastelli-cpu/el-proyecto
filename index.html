<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi página cool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fuente -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      overflow-x: hidden;
    }

    header {
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: 600;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
    }

    .hero {
      height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
    }

    .hero h1 {
      font-size: 60px;
      margin-bottom: 20px;
      animation: fadeIn 2s ease-in-out;
    }

    .hero p {
      font-size: 20px;
      opacity: 0.8;
    }

    .btn {
      margin-top: 30px;
      padding: 15px 30px;
      background: #38bdf8;
      border: none;
      border-radius: 30px;
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      transform: scale(1.1);
      background: #0ea5e9;
    }

    .cards {
      display: flex;
      gap: 20px;
      padding: 50px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .card {
      background: rgba(255,255,255,0.05);
      padding: 30px;
      border-radius: 20px;
      width: 250px;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-10px);
      background: rgba(255,255,255,0.1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px);}
      to { opacity: 1; transform: translateY(0);}
    }
  </style>
</head>

<body>

<header>
  Mi Web 🚀
</header>

<section class="hero">
  <h1>Hola, soy Ana</h1>
  <p>Esta es mi página épica hecha en VS Code</p>
  <button class="btn" onclick="saludo()">Click acá</button>
</section>

<section class="cards">
  <div class="card">🔥 Diseño moderno</div>
  <div class="card">⚡ Rápido</div>
  <div class="card">🌍 Subido a GitHub</div>
</section>

<script>
  function saludo() {
    alert("Bienvenido a mi página 😎");
  }
</script>

</body>
</html>
